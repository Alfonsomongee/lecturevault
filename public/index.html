<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LectureVault — Recordings Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #334155;
      --border: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --new-bg: rgba(59, 130, 246, 0.1);
      --seen-bg: rgba(148, 163, 184, 0.05);
      --processed-bg: rgba(34, 197, 94, 0.1);
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    h1 .icon { font-size: 1.5rem; }

    .stats {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .stat {
      background: var(--surface);
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    .filter-btn:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .sync-btn {
      background: var(--accent);
      border: none;
      color: white;
      padding: 0.5rem 1.25rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sync-btn:hover { background: var(--accent-hover); }
    .sync-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .sync-info {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    th {
      background: var(--surface-hover);
      padding: 0.875rem 1rem;
      text-align: left;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    th:hover { color: var(--text); }

    th .sort-icon {
      margin-left: 0.25rem;
      opacity: 0.3;
    }

    th.sorted .sort-icon { opacity: 1; color: var(--accent); }

    td {
      padding: 0.875rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.875rem;
    }

    tr:hover td { background: rgba(255,255,255,0.02); }

    tr.status-new td { background: var(--new-bg); }
    tr.status-processed td { background: var(--processed-bg); }

    .recording-title {
      font-weight: 600;
      max-width: 400px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-new { background: rgba(59,130,246,0.2); color: #60a5fa; }
    .status-seen { background: rgba(148,163,184,0.2); color: #94a3b8; }
    .status-processed { background: rgba(34,197,94,0.2); color: #4ade80; }

    .duration {
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .date {
      color: var(--text-muted);
      white-space: nowrap;
    }

    .playback-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.8rem;
    }

    .playback-link:hover { text-decoration: underline; }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--text-muted);
    }

    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
    .empty-state h2 { font-size: 1.25rem; margin-bottom: 0.5rem; color: var(--text); }
    .empty-state p { max-width: 400px; margin: 0 auto; }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .spinner {
      display: inline-block;
      width: 1.5rem;
      height: 1.5rem;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .stats { width: 100%; justify-content: space-between; }
      .recording-title { max-width: 200px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span class="icon">🎓</span> LectureVault</h1>
      <div class="stats" id="stats">
        <div class="stat">
          <div class="stat-value" id="stat-total">-</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-new">-</div>
          <div class="stat-label">New</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-seen">-</div>
          <div class="stat-label">Seen</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="stat-processed">-</div>
          <div class="stat-label">Processed</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="new">New</button>
        <button class="filter-btn" data-filter="seen">Seen</button>
        <button class="filter-btn" data-filter="processed">Processed</button>
      </div>
      <div>
        <span class="sync-info" id="last-sync"></span>
      </div>
    </div>

    <div id="content">
      <div class="loading"><div class="spinner"></div><p style="margin-top:1rem">Loading recordings…</p></div>
    </div>
  </div>

  <script>
    let currentFilter = 'all';
    let currentSort = { field: 'created_at', dir: 'desc' };
    let allRecordings = [];

    async function fetchRecordings(status) {
      const url = status && status !== 'all'
        ? `/api/recordings?status=${status}`
        : '/api/recordings';
      const res = await fetch(url);
      return res.json();
    }

    function formatDuration(seconds) {
      if (!seconds) return '—';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) return `${h}h ${String(m).padStart(2, '0')}m`;
      if (m > 0) return `${m}m ${String(s).padStart(2, '0')}s`;
      return `${s}s`;
    }

    function formatDate(dateStr) {
      if (!dateStr) return '—';
      try {
        const d = new Date(dateStr);
        return d.toLocaleDateString('en-US', {
          year: 'numeric', month: 'short', day: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
      } catch { return dateStr; }
    }

    function sortRecordings(recordings, field, dir) {
      return [...recordings].sort((a, b) => {
        let va = a[field] || '';
        let vb = b[field] || '';
        if (field === 'duration_seconds') { va = Number(va); vb = Number(vb); }
        if (va < vb) return dir === 'asc' ? -1 : 1;
        if (va > vb) return dir === 'asc' ? 1 : -1;
        return 0;
      });
    }

    function renderTable(recordings) {
      if (!recordings.length) {
        return `
          <div class="empty-state">
            <div class="icon">📭</div>
            <h2>No recordings found</h2>
            <p>Run a sync to fetch recordings from your university's Collab2 system, or adjust the filter.</p>
          </div>`;
      }

      const sorted = sortRecordings(recordings, currentSort.field, currentSort.dir);
      const sortIcon = (field) => {
        const active = currentSort.field === field;
        const arrow = currentSort.dir === 'asc' ? '↑' : '↓';
        return `<span class="sort-icon">${active ? arrow : '↕'}</span>`;
      };
      const sortClass = (field) => currentSort.field === field ? 'sorted' : '';

      let html = `<table>
        <thead><tr>
          <th class="${sortClass('title')}" onclick="toggleSort('title')">Title ${sortIcon('title')}</th>
          <th class="${sortClass('created_at')}" onclick="toggleSort('created_at')">Date ${sortIcon('created_at')}</th>
          <th class="${sortClass('duration_seconds')}" onclick="toggleSort('duration_seconds')">Duration ${sortIcon('duration_seconds')}</th>
          <th class="${sortClass('status')}" onclick="toggleSort('status')">Status ${sortIcon('status')}</th>
          <th>Link</th>
        </tr></thead><tbody>`;

      for (const rec of sorted) {
        const safeTitle = rec.title.replace(/</g, '&lt;').replace(/>/g, '&gt;');
        html += `<tr class="status-${rec.status}">
          <td><div class="recording-title" title="${safeTitle}">${safeTitle}</div></td>
          <td class="date">${formatDate(rec.created_at)}</td>
          <td class="duration">${formatDuration(rec.duration_seconds)}</td>
          <td><span class="status-badge status-${rec.status}">${rec.status}</span></td>
          <td>${rec.playback_url ? `<a class="playback-link" href="${rec.playback_url}" target="_blank" rel="noopener">Open ↗</a>` : '—'}</td>
        </tr>`;
      }

      html += '</tbody></table>';
      return html;
    }

    function toggleSort(field) {
      if (currentSort.field === field) {
        currentSort.dir = currentSort.dir === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.field = field;
        currentSort.dir = field === 'title' ? 'asc' : 'desc';
      }
      document.getElementById('content').innerHTML = renderTable(allRecordings);
    }

    async function loadData() {
      try {
        const data = await fetchRecordings(currentFilter);
        allRecordings = data.recordings || [];

        // Update stats
        if (data.stats) {
          document.getElementById('stat-total').textContent = data.stats.total ?? 0;
          document.getElementById('stat-new').textContent = data.stats.new ?? 0;
          document.getElementById('stat-seen').textContent = data.stats.seen ?? 0;
          document.getElementById('stat-processed').textContent = data.stats.processed ?? 0;
        }

        // Update timestamp
        document.getElementById('last-sync').textContent =
          `Last updated: ${new Date(data.timestamp).toLocaleTimeString()}`;

        // Render table
        document.getElementById('content').innerHTML = renderTable(allRecordings);
      } catch (err) {
        document.getElementById('content').innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <h2>Connection Error</h2>
            <p>Could not load recordings. Is the server running?</p>
          </div>`;
      }
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        loadData();
      });
    });

    // Initial load
    loadData();

    // Auto-refresh every 30 seconds
    setInterval(loadData, 30000);
  </script>
</body>
</html>
