<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>LectureVault</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2337352f'/%3E%3Cpath d='M9 8v16h14' stroke='white' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
  <script src="/vendor/marked.js" defer></script>
  <script src="/vendor/purify.js" defer></script>
  <script src="/vendor/katex/katex.min.js" defer></script>
  <script type="module" src="/app/main.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navegación">
      <div class="workspace">LectureVault</div>
      <form class="side-search" id="search-form" role="search" autocomplete="off">
        <span id="search-ico"></span>
        <label class="sr-only" for="global-search">Buscar en todas las clases</label>
        <input id="global-search" type="search" placeholder="Buscar" maxlength="200">
        <kbd aria-hidden="true">/</kbd>
      </form>
      <nav class="nav" id="nav" aria-label="Secciones"></nav>
      <div class="side-courses">
        <div class="side-title">Asignaturas</div>
        <div class="nav" id="side-courses"></div>
      </div>
      <div class="side-foot nav" id="side-foot"></div>
    </aside>
    <main class="main"><div class="page" id="view" tabindex="-1"></div></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
